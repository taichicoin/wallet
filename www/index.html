<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>My Wallet</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --text: #ffffff;
            --sub: #a0a0a0;
            --accent: #4c6ef5;
            --danger: #ff4d4d;
            --green: #34d399;
            --border: #2a2a2a;
            --radius: 16px;
        }
        body.light {
            --bg: #f5f5f5;
            --card: #ffffff;
            --text: #0f0f0f;
            --sub: #666666;
            --border: #dddddd;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: calc(4vh + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom)) 16px;
            position: relative;
        }
        .container { width: 100%; max-width: 420px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            margin-top: 10px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .account-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            max-width: 140px;
            overflow: hidden;
        }
        .account-dot {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .account-addr {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .network-badge, .settings-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        .network-dot {
            width: 20px; height: 20px;
            border-radius: 50%;
            object-fit: cover;
        }
        .asset-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            margin: 8px 0;
        }
        .balance-fiat { color: var(--sub); font-size: 14px; }
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .action-btn {
            flex: 1;
            background: var(--card);
            border: none;
            border-radius: 12px;
            padding: 14px 0;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #2a2a2a; }
        .token-list-title {
            color: var(--sub);
            font-size: 13px;
            margin-bottom: 10px;
            padding-left: 8px;
        }
        .token-item {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .token-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .token-icon {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }
        .token-name { font-weight: 500; }
        .token-symbol { color: var(--sub); font-size: 13px; }
        .token-balance { text-align: right; }
        .token-balance .amount { font-weight: 600; }
        .token-balance .fiat { color: var(--sub); font-size: 12px; }
        .fab {
            position: fixed;
            bottom: calc(28px + env(safe-area-inset-bottom));
            right: max(28px, calc(28px + env(safe-area-inset-right)));
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(76,110,245,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--card);
            width: 100%;
            max-width: 420px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            animation: slideUp 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* 浏览器弹窗全宽紧凑 */
        #browserModal .modal-content {
            max-width: 100%;
            width: 100%;
            border-radius: 20px 20px 0 0;
            height: 85vh;
            padding: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #browserModal .browser-toolbar {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 4px;
        }
        #browserModal .browser-toolbar button {
            background: var(--card);
            border: none;
            color: var(--text);
            padding: 3px 5px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #browserModal .browser-toolbar input {
            flex: 1;
            margin: 0;
            padding: 4px 5px;
            font-size: 14px;
        }
        #browserModal .browser-toolbar .btn-primary {
            width: auto;
            padding: 4px 7px;
        }
        /* 桌面视图 */
        #desktopView {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 16px;
            gap: 16px;
            overflow-y: auto;
        }
        .desktop-icon {
            width: 72px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
            gap: 6px;
        }
        .desktop-icon img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
        }
        .desktop-icon span {
            font-size: 12px;
            color: var(--text);
            word-break: break-all;
        }
        /* 原生 WebView 占位区域（隐藏） */
        #dappContentArea {
            flex: 1;
            position: relative;
            display: none;
        }
        /* 底部标题 */
        #browserModal .browser-bottom-title {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            padding: 8px 0;
            margin-top: auto;
            border-top: 1px solid var(--border);
        }
        #browserModal .browser-bottom-title.hidden { display: none; }

        /* DApp 模式：彻底消除底部空白占位 */
        #browserModal.is-dapp-mode .modal-content {
            padding-bottom: 0 !important;
        }
        #browserModal.is-dapp-mode .browser-bottom-title {
            display: none !important;
            height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            border: none !important;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-btn { cursor: pointer; font-size: 24px; }
        .chain-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
        }
        .chain-list-item:hover { background: #2a2a2a; }
        .chain-list-item.active { background: #2a2a2a; }
        .chain-icon {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .chain-name { font-weight: 500; }
        .chain-symbol { color: var(--sub); font-size: 13px; }
        input, textarea {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            font-size: 14px;
            margin: 8px 0;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .danger-text { color: var(--danger); font-size: 12px; margin-top: 8px; display: block; }
        .tx-status {
            margin-top: 12px;
            padding: 8px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }
        .tx-status.pending { background: #2a2a2a; color: var(--accent); }
        .tx-status.success { background: #1b3a2a; color: var(--green); }
        .tx-status.error { background: #3a1b1b; color: var(--danger); }
        .lock-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lock-overlay.hidden { display: none; }
        .lock-box {
            background: var(--card);
            padding: 24px;
            border-radius: var(--radius);
            width: 80%;
            max-width: 320px;
            text-align: center;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .setting-item .label { font-weight: 500; }
        .settings-section { margin-top: 24px; }
        .account-manage-item {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .account-manage-item:hover { background: #2a2a2a; }
    </style>
</head>
<body>

<!-- 安全锁遮罩 -->
<div id="securityOverlay" class="lock-overlay hidden">
    <div class="lock-box">
        <h3 style="margin-bottom:16px;">🔒 应用已锁定</h3>
        <input type="password" id="securityUnlockPassword" placeholder="输入应用密码" />
        <button class="btn-primary" onclick="verifySecurityPassword()">解锁</button>
        <button id="biometricUnlockBtn" class="btn-outline" onclick="startBiometricUnlock()" style="display:none; margin-top:8px;">🔐 指纹解锁</button>
        <div id="securityUnlockError" style="color:var(--danger); margin-top:8px; display:none;">密码错误</div>
    </div>
</div>

<div id="toast" style="position:fixed; top:calc(20px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 24px; border-radius:8px; z-index:999; display:none; max-width:80%; text-align:center; font-size:14px;"></div>

<div class="container" id="mainContainer">
    <div class="header">
        <div class="account-info" onclick="openAccountModal()">
            <div class="account-dot">👤</div>
            <span class="account-addr" id="topAddress">未导入</span>
        </div>
        <div class="header-right">
            <div class="network-badge" onclick="openNetworkModal()">
                <img id="networkLogo" class="network-dot" src="imagine/eth.jpg" />
                <span id="topNetwork">Ethereum</span>
            </div>
            <div class="settings-badge" onclick="openSettingsModal()" title="设置">
                ⚙️
            </div>
        </div>
    </div>

    <div class="asset-card">
        <div style="font-size:14px; color:var(--sub);">总资产</div>
        <div class="balance-amount" id="totalBalance">0.00</div>
        <div class="balance-fiat" id="fiatValue">$0.00 USD</div>
    </div>

    <div class="actions">
        <button class="action-btn" onclick="openSendModal()">
            <span>📤</span> 发送
        </button>
        <button class="action-btn" onclick="showReceiveModal()">
            <span>📥</span> 接收
        </button>
        <button class="action-btn" onclick="openAccountModal()">
            <span>👤</span> 账户
        </button>
    </div>

    <div class="token-list-title">资产</div>
    <div id="tokenList"></div>
</div>

<button id="fabBtn" class="fab" onclick="openBrowserModal()">🌐</button>

<!-- 账户管理弹窗 -->
<div class="modal-overlay" id="accountModal">
    <div class="modal-content">
        <div class="modal-title">
            <span>账户管理</span>
            <span onclick="closeAccountModal()" class="close-btn">&times;</span>
        </div>
        <select id="accountSelect" onchange="switchAccount()" style="background:var(--card); border:1px solid var(--border); color:var(--text); padding:12px; border-radius:8px; width:100%; margin-bottom:10px;">
            <option value="">-- 选择账户 --</option>
        </select>
        <button class="btn-outline" onclick="deleteAccount()">删除当前账户</button>
    </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
        <div class="modal-title">
            <span>设置</span>
            <span onclick="closeSettingsModal()" class="close-btn">&times;</span>
        </div>
        <h4>导入钱包</h4>
        <textarea id="secretInput" placeholder="助记词 或 私钥(0x开头)" rows="3"></textarea>
        <input type="password" id="encryptPassword" placeholder="设置解锁密码（至少6位）" />
        <input type="password" id="encryptPasswordConfirm" placeholder="确认解锁密码" />
        <button class="btn-primary" onclick="importWallet()">加密导入</button>
        <span class="danger-text">⚠️ 密码丢失无法找回，私钥将以加密形式存储</span>

        <h4 style="margin-top:20px;">⚙️ 通用</h4>
        <div class="setting-item" onclick="toggleTheme()">
            <span class="label">🌓 黑白模式</span>
            <span id="themeModeText">浅色</span>
        </div>
        <div class="setting-item" onclick="toggleSecuritySettings()">
            <span class="label">🔐 应用锁</span>
            <span id="appLockStatus">未启用</span>
        </div>
        <div class="setting-item">
            <span class="label">指纹解锁</span>
            <input type="checkbox" id="biometricCheck" onchange="toggleBiometricEnable(this.checked)" />
        </div>
        <div id="securityPasswordSection" style="display:none; margin-top:10px;">
            <input type="password" id="securityOldPassword" placeholder="当前密码（修改/关闭时必填）" />
            <input type="password" id="securityNewPassword" placeholder="新密码（至少4位）" />
            <input type="password" id="securityConfirmPassword" placeholder="确认新密码" />
            <div style="display:flex; gap:8px;">
                <button class="btn-primary" onclick="enableSecurityPassword()" style="flex:1;">启用/修改</button>
                <button class="btn-outline" onclick="disableSecurityPassword()" style="flex:1;">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- 网络切换弹窗 -->
<div class="modal-overlay" id="networkModal">
    <div class="modal-content">
        <div class="modal-title">
            <span>选择网络</span>
            <span onclick="closeNetworkModal()" class="close-btn">&times;</span>
        </div>
        <div id="chainListContainer"></div>
    </div>
</div>

<!-- 发送弹窗 -->
<div class="modal-overlay" id="sendModal">
    <div class="modal-content">
        <div class="modal-title">
            <span>发送交易</span>
            <span onclick="closeSendModal()" class="close-btn">&times;</span>
        </div>
        <input type="text" id="sendTo" placeholder="接收地址 (0x...)" />
        <input type="text" id="sendAmount" placeholder="金额 (主链币)" />
        <button class="btn-primary" onclick="executeSend()">确认发送</button>
        <div id="sendStatus" class="tx-status" style="display:none;"></div>
    </div>
</div>

<!-- 钱包解锁弹窗 -->
<div class="modal-overlay" id="unlockModal">
    <div class="modal-content">
        <div class="modal-title">
            <span>解锁钱包</span>
            <span onclick="closeUnlockModal()" class="close-btn">&times;</span>
        </div>
        <input type="password" id="unlockPassword" placeholder="输入解锁密码" />
        <button class="btn-primary" id="unlockBtn" onclick="executeUnlock()">解锁</button>
        <div id="unlockStatus" class="tx-status" style="display:none;"></div>
    </div>
</div>

<!-- DApp 浏览器弹窗 -->
<div class="modal-overlay" id="browserModal">
    <div class="modal-content">
        <div class="browser-toolbar">
            <button onclick="browserBack()">←</button>
            <button onclick="browserForward()">→</button>
            <input type="text" id="browserUrl" placeholder="输入 DApp 网址" />
            <button class="btn-primary" onclick="navigateBrowser()">前往</button>
        </div>

        <!-- 桌面视图 -->
        <div id="desktopView">
            <div class="desktop-icon" onclick="openBrowserFromDesktop('https://pancakeswap.finance')">
                <img src="imagine/pancake.png" alt="PancakeSwap" onerror="this.style.background='#333'; this.style.borderRadius='12px';" />
                <span>PancakeSwap</span>
            </div>
            <div class="desktop-icon" onclick="openBrowserFromDesktop('https://app.uniswap.org')">
                <img src="imagine/uniswap.png" alt="Uniswap" onerror="this.style.background='#333'; this.style.borderRadius='12px';" />
                <span>Uniswap</span>
            </div>
            <div class="desktop-icon" onclick="openBrowserFromDesktop('https://sushi.com')">
                <img src="imagine/sushi.png" alt="SushiSwap" onerror="this.style.background='#333'; this.style.borderRadius='12px';" />
                <span>SushiSwap</span>
            </div>
            <div class="desktop-icon" onclick="openBrowserFromDesktop('https://aave.com')">
                <img src="imagine/aave.png" alt="Aave" onerror="this.style.background='#333'; this.style.borderRadius='12px';" />
                <span>Aave</span>
            </div>
        </div>

        <div id="dappContentArea"></div>
        <div class="browser-bottom-title" id="browserBottomTitle">DApp 浏览器</div>
    </div>
</div>

<!-- 脚本加载顺序 -->
<script src="js/ethers.umd.min.js"></script>
<script src="main.js"></script>
<script src="js/tokenM.js"></script>
<script src="js/security.js"></script>
<script src="js/dappB.js"></script>
<script>
    // ========== DApp 浏览器核心逻辑 ==========
    function openBrowserModal(url) {
        const modal = document.getElementById('browserModal');
        if (!modal) return;

        if (!modal.classList.contains('active')) {
            modal.classList.add('active');
        }

        if (!url) {
            modal.classList.remove('is-dapp-mode');
            showDesktopView();
            // 桌面模式下按钮保持地球图标
            const fabBtn = document.getElementById('fabBtn');
            fabBtn.textContent = '🌐';
            fabBtn.onclick = openBrowserModal;
            return;
        }

        // DApp 模式：切换按钮为关闭叉号
        modal.classList.add('is-dapp-mode');
        hideDesktopView();
        const fabBtn = document.getElementById('fabBtn');
        fabBtn.textContent = '✕';
        fabBtn.onclick = closeBrowserModal;

        // 计算 WebView 精确高度
        const toolbar = document.querySelector('#browserModal .browser-toolbar');
        if (!toolbar) {
            showToast('找不到地址栏');
            showDesktopView();
            return;
        }

        const rect = toolbar.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const top = Math.round(rect.bottom * dpr);
        const viewportBottom = Math.round(window.innerHeight * dpr);
        const height = viewportBottom - top;

        if (window.android && typeof window.android.showDapp === 'function') {
            window.android.showDapp(url, top, height);
        } else {
            showToast('原生浏览器不可用');
            showDesktopView();
        }
    }

    function closeBrowserModal() {
        // 销毁原生 WebView
        if (window.android && typeof window.android.hideDapp === 'function') {
            window.android.hideDapp();
        }

        const modal = document.getElementById('browserModal');
        modal.classList.remove('active');
        modal.classList.remove('is-dapp-mode');
        
        // 重置桌面视图与地址栏
        showDesktopView();
        document.getElementById('browserUrl').value = '';

        // 按钮切回地球图标
        const fabBtn = document.getElementById('fabBtn');
        fabBtn.textContent = '🌐';
        fabBtn.onclick = openBrowserModal;
    }

    function navigateBrowser() {
        const url = document.getElementById('browserUrl').value.trim();
        if (!url) return;
        openBrowserModal(url);
    }

    function showDesktopView() {
        document.getElementById('desktopView').style.display = 'flex';
        const area = document.getElementById('dappContentArea');
        if (area) area.style.display = 'none';
        const bottom = document.getElementById('browserBottomTitle');
        if (bottom) bottom.classList.remove('hidden');
    }

    function hideDesktopView() {
        document.getElementById('desktopView').style.display = 'none';
        const bottom = document.getElementById('browserBottomTitle');
        if (bottom) bottom.classList.add('hidden');
    }

    function openBrowserFromDesktop(url) {
        openBrowserModal(url);
    }
    function openDapp(url) { openBrowserModal(url); }
    function browserBack() {}
    function browserForward() {}

    // ========== 弹窗控制 ==========
    function openAccountModal() {
        document.getElementById('accountModal').classList.add('active');
        if (typeof updateAccountSelect === 'function') updateAccountSelect();
    }
    function closeAccountModal() {
        document.getElementById('accountModal').classList.remove('active');
    }

    function openSettingsModal() {
        document.getElementById('settingsModal').classList.add('active');
        if (typeof syncSecurityUI === 'function') syncSecurityUI();
        const isLight = document.body.classList.contains('light');
        document.getElementById('themeModeText').innerText = isLight ? '浅色' : '暗黑';
    }
    function closeSettingsModal() {
        document.getElementById('settingsModal').classList.remove('active');
    }

    function showImportSection() {
        openSettingsModal();
    }

    // ========== 统一初始化 ==========
    window.addEventListener('DOMContentLoaded', () => {
        // 默认白色主题
        if (!localStorage.getItem('theme')) localStorage.setItem('theme', 'light');
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
            document.getElementById('themeModeText').innerText = '浅色';
        } else {
            document.body.classList.remove('light');
            document.getElementById('themeModeText').innerText = '暗黑';
        }

        if (typeof initSecurity === 'function') {
            initSecurity();
        } else if (typeof startApp === 'function') {
            startApp();
        }

        // 遮罩点击关闭
        document.getElementById('accountModal').addEventListener('click', e => { if (e.target === document.getElementById('accountModal')) closeAccountModal(); });
        document.getElementById('settingsModal').addEventListener('click', e => { if (e.target === document.getElementById('settingsModal')) closeSettingsModal(); });
        document.getElementById('browserModal').addEventListener('click', e => { if (e.target === document.getElementById('browserModal')) closeBrowserModal(); });
    });
</script>
</body>
</html>
