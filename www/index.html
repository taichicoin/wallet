<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Multi-Chain Wallet</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        input, select, textarea { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 3px; }
        button:disabled { background: #aaa; }
        button.danger { background: #f44336; }
        #status { color: red; }
        #nodeInfo { font-size: 0.9em; color: #666; word-break: break-all; }
        .account-selector { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>🔐 多链 EVM 钱包（本地存储）</h1>

    <!-- 0. 账户选择与管理 -->
    <div class="section">
        <h3>👛 当前账户</h3>
        <div class="account-selector">
            <select id="accountSelect" onchange="switchAccount()" style="flex:1;">
                <option value="">-- 没有账户，请导入 --</option>
            </select>
            <button onclick="deleteAccount()" class="danger">🗑️ 删除</button>
        </div>
        <p>当前地址: <span id="addressDisplay">未导入</span></p>
    </div>

    <!-- 1. 导入助记词或私钥 -->
    <div class="section">
        <h3>1️⃣ 导入钱包</h3>
        <textarea id="secretInput" placeholder="输入助记词（空格分隔） 或 私钥（0x开头）" rows="3"></textarea>
        <div style="display:flex; gap: 10px;">
            <button onclick="importWallet()" style="flex:1;">📥 导入</button>
        </div>
        <p style="font-size:0.8em; color: orange;">⚠️ 私钥明文存储在本地，仅限测试！请勿用于主网大额资产。</p>
    </div>

    <!-- 2. 切换网络与节点 -->
    <div class="section">
        <h3>2️⃣ 网络与节点</h3>
        <select id="chainSelect" onchange="switchChain()">
            <option value="">-- 请选择网络 --</option>
        </select>
        <button onclick="changeNode()" id="changeNodeBtn" disabled>🔄 换节点</button>
        <p>当前网络: <span id="networkName">-</span></p>
        <p>当前节点: <span id="nodeInfo">-</span></p>
        <p>主链币余额: <span id="balanceDisplay">-</span></p>
        <button onclick="refreshBalance()">刷新余额</button>
    </div>

    <!-- 3. 转账 -->
    <div class="section">
        <h3>3️⃣ 发送交易</h3>
        <input type="text" id="toAddress" placeholder="接收地址（0x开头）">
        <input type="text" id="amount" placeholder="发送数量（主链币）">
        <button id="sendBtn" onclick="sendTransaction()" disabled>发送</button>
        <p id="status"></p>
    </div>

    <script src="js/ethers.umd.min.js"></script>
    <script>
        // ============ 多链配置 ============
        const chains = [
            { id: 1, name: "Ethereum Mainnet", symbol: "ETH", explorer: "https://etherscan.io", rpcs: ["https://eth.llamarpc.com","https://rpc.ankr.com/eth","https://cloudflare-eth.com"] },
            { id: 56, name: "BNB Smart Chain", symbol: "BNB", explorer: "https://bscscan.com", rpcs: ["https://bsc-dataseed.binance.org","https://bsc-dataseed1.defibit.io","https://bsc-dataseed2.ninicoin.io"] },
            { id: 97, name: "BSC Testnet", symbol: "tBNB", explorer: "https://testnet.bscscan.com", rpcs: ["https://data-seed-prebsc-1-s1.binance.org:8545","https://data-seed-prebsc-2-s1.binance.org:8545","https://bsc-testnet.publicnode.com"] },
            { id: 137, name: "Polygon", symbol: "MATIC", explorer: "https://polygonscan.com", rpcs: ["https://polygon-rpc.com","https://rpc-mainnet.maticvigil.com","https://polygon-mainnet.g.alchemy.com/v2/demo"] },
            { id: 42161, name: "Arbitrum One", symbol: "ETH", explorer: "https://arbiscan.io", rpcs: ["https://arb1.arbitrum.io/rpc","https://arbitrum-mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"] },
            { id: 10, name: "Optimism", symbol: "ETH", explorer: "https://optimistic.etherscan.io", rpcs: ["https://mainnet.optimism.io","https://optimism-mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"] },
            { id: 43114, name: "Avalanche C-Chain", symbol: "AVAX", explorer: "https://snowtrace.io", rpcs: ["https://api.avax.network/ext/bc/C/rpc","https://avalanche-c-chain.publicnode.com","https://rpc.ankr.com/avalanche"] }
        ];

        // ============ 全局状态 ============
        let wallet = null;          // 当前 ethers.Wallet 实例
        let provider = null;
        let currentChainId = null;
        let currentRpcIndex = 0;
        let currentChainRpcs = [];

        // 所有钱包账户存储（从 localStorage 加载）
        let accounts = [];          // [{ address, privateKey, type: 'mnemonic'/'privateKey', mnemonic? }]

        // ============ 初始化 ============
        function initChainSelect() {
            const select = document.getElementById('chainSelect');
            select.innerHTML = '<option value="">-- 请选择网络 --</option>';
            chains.forEach(chain => {
                const option = document.createElement('option');
                option.value = chain.id;
                option.text = chain.name;
                select.appendChild(option);
            });
        }

        // 加载本地账户
        function loadAccounts() {
            const stored = localStorage.getItem('mywallet_accounts');
            if (stored) {
                try {
                    accounts = JSON.parse(stored);
                } catch(e) {
                    accounts = [];
                }
            } else {
                accounts = [];
            }
            updateAccountUI();
        }

        // 保存账户到本地
        function saveAccounts() {
            localStorage.setItem('mywallet_accounts', JSON.stringify(accounts));
            updateAccountUI();
        }

        // 更新账户选择下拉框
        function updateAccountUI() {
            const select = document.getElementById('accountSelect');
            select.innerHTML = '<option value="">-- 选择账户 --</option>';
            accounts.forEach((acc, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.text = `${acc.address.substring(0,10)}... (${acc.type})`;
                select.appendChild(option);
            });
            // 如果当前有活跃钱包且索引存在，选中对应项
            if (wallet) {
                const idx = accounts.findIndex(a => a.address === wallet.address);
                if (idx !== -1) select.value = idx;
            } else if (accounts.length === 0) {
                document.getElementById('addressDisplay').innerText = '未导入';
                document.getElementById('sendBtn').disabled = true;
            }
        }

        // 切换账户
        function switchAccount() {
            const select = document.getElementById('accountSelect');
            const index = select.value;
            if (index === '') {
                wallet = null;
                document.getElementById('addressDisplay').innerText = '未选择';
                document.getElementById('sendBtn').disabled = true;
                return;
            }
            const acc = accounts[parseInt(index)];
            try {
                if (acc.type === 'mnemonic') {
                    wallet = ethers.Wallet.fromMnemonic(acc.mnemonic);
                } else {
                    wallet = new ethers.Wallet(acc.privateKey);
                }
                // 连接 provider（如果有）
                if (provider) {
                    wallet = wallet.connect(provider);
                }
                document.getElementById('addressDisplay').innerText = wallet.address;
                document.getElementById('sendBtn').disabled = false;
                if (provider) refreshBalance();
            } catch (e) {
                alert('切换失败: ' + e.message);
            }
        }

        // 删除账户
        function deleteAccount() {
            const select = document.getElementById('accountSelect');
            const index = select.value;
            if (index === '') return;
            if (!confirm('确定删除该账户？此操作不可恢复！')) return;
            accounts.splice(parseInt(index), 1);
            saveAccounts();
            wallet = null;
            document.getElementById('addressDisplay').innerText = '已删除';
            document.getElementById('sendBtn').disabled = true;
            if (accounts.length > 0) {
                select.value = 0;
                switchAccount();
            }
        }

        // 导入钱包（自动判断助记词或私钥）
        async function importWallet() {
            const input = document.getElementById('secretInput').value.trim();
            if (!input) return alert('请输入助记词或私钥');

            let newWallet;
            let type;
            let mnemonic = null;

            // 判断是私钥还是助记词
            if (input.startsWith('0x') && input.length === 66) {
                // 私钥
                try {
                    newWallet = new ethers.Wallet(input);
                    type = 'privateKey';
                } catch (e) {
                    return alert('无效的私钥');
                }
            } else {
                // 尝试作为助记词
                try {
                    newWallet = ethers.Wallet.fromMnemonic(input);
                    type = 'mnemonic';
                    mnemonic = input;
                } catch (e) {
                    return alert('无效的助记词或私钥');
                }
            }

            // 检查是否已存在相同地址
            if (accounts.some(acc => acc.address === newWallet.address)) {
                return alert('该地址已存在，无需重复导入');
            }

            // 保存到数组
            accounts.push({
                address: newWallet.address,
                privateKey: newWallet.privateKey,
                type: type,
                mnemonic: mnemonic
            });
            saveAccounts();

            // 设置为当前钱包
            wallet = newWallet;
            if (provider) {
                wallet = wallet.connect(provider);
                refreshBalance();
            }
            document.getElementById('addressDisplay').innerText = wallet.address;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('secretInput').value = '';
            // 选中新添加的账户
            const newIndex = accounts.length - 1;
            document.getElementById('accountSelect').value = newIndex;
        }

        // ============ 网络与节点 ============
        async function tryConnectProvider(rpcUrl, chainId, chainName) {
            const prov = new ethers.providers.JsonRpcProvider(
                { url: rpcUrl, timeout: 10000 },
                { chainId: chainId, name: chainName }
            );
            await prov.getBlockNumber();
            return prov;
        }

        async function connectToChain(chain, startIndex = 0) {
            const rpcs = chain.rpcs;
            for (let i = startIndex; i < rpcs.length; i++) {
                try {
                    const prov = await tryConnectProvider(rpcs[i], chain.id, chain.name);
                    currentRpcIndex = i;
                    currentChainRpcs = rpcs;
                    return prov;
                } catch (e) {
                    console.warn(`节点 ${rpcs[i]} 连接失败: ${e.message}`);
                    if (i === rpcs.length - 1) {
                        throw new Error(`所有节点均无法连接 (${chain.name})`);
                    }
                }
            }
        }

        async function switchChain() {
            const chainId = parseInt(document.getElementById('chainSelect').value);
            if (!chainId) return;
            const chain = chains.find(c => c.id === chainId);
            if (!chain) return;
            try {
                provider = await connectToChain(chain, 0);
                document.getElementById('networkName').innerText = chain.name;
                document.getElementById('nodeInfo').innerText = chain.rpcs[currentRpcIndex];
                document.getElementById('changeNodeBtn').disabled = false;
                currentChainId = chain.id;
                if (wallet) {
                    wallet = wallet.connect(provider);
                    refreshBalance();
                }
            } catch (e) {
                alert('连接失败: ' + e.message);
                document.getElementById('networkName').innerText = '连接失败';
                document.getElementById('nodeInfo').innerText = '-';
                document.getElementById('changeNodeBtn').disabled = true;
            }
        }

        async function changeNode() {
            if (!currentChainId || currentChainRpcs.length === 0) return;
            const chain = chains.find(c => c.id === currentChainId);
            if (!chain) return;
            const nextIndex = (currentRpcIndex + 1) % currentChainRpcs.length;
            try {
                const prov = await tryConnectProvider(currentChainRpcs[nextIndex], chain.id, chain.name);
                provider = prov;
                currentRpcIndex = nextIndex;
                document.getElementById('nodeInfo').innerText = currentChainRpcs[currentRpcIndex];
                if (wallet) {
                    wallet = wallet.connect(provider);
                    refreshBalance();
                }
            } catch (e) {
                alert('切换节点失败: ' + e.message);
            }
        }

        async function refreshBalance() {
            if (!wallet || !provider) return;
            try {
                const balance = await provider.getBalance(wallet.address);
                const symbol = chains.find(c => c.id === currentChainId)?.symbol || 'ETH';
                document.getElementById('balanceDisplay').innerText =
                    ethers.utils.formatEther(balance) + ' ' + symbol;
            } catch (e) {
                document.getElementById('balanceDisplay').innerText = '查询失败: ' + e.message;
            }
        }

        async function sendTransaction() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = '';
            if (!wallet || !provider) {
                statusEl.innerText = '请先导入钱包并选择网络';
                return;
            }
            const toAddress = document.getElementById('toAddress').value.trim();
            const amount = document.getElementById('amount').value.trim();
            if (!ethers.utils.isAddress(toAddress)) {
                statusEl.innerText = '无效的接收地址';
                return;
            }
            if (!amount || isNaN(amount) || Number(amount) <= 0) {
                statusEl.innerText = '请输入有效的金额';
                return;
            }
            try {
                statusEl.innerText = '正在发送交易...';
                const tx = await wallet.sendTransaction({
                    to: toAddress,
                    value: ethers.utils.parseEther(amount)
                });
                statusEl.innerText = '交易已广播，哈希: ' + tx.hash;
                console.log('交易详情:', tx);
            } catch (e) {
                statusEl.innerText = '发送失败: ' + e.message;
                console.error(e);
            }
        }

        // ============ 页面加载 ============
        window.onload = () => {
            initChainSelect();
            loadAccounts();
            // 如果有已保存账户，自动选择第一个
            if (accounts.length > 0) {
                document.getElementById('accountSelect').value = 0;
                switchAccount();
            }
        };
    </script>
</body>
</html>
