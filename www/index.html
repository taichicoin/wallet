<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Wallet</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --text: #ffffff;
            --sub: #a0a0a0;
            --accent: #4c6ef5;
            --danger: #ff4d4d;
            --green: #34d399;
            --border: #2a2a2a;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px 100px;
            position: relative;
        }
        .container { width: 100%; max-width: 420px; }

        /* 顶部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .account-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            max-width: 180px;
            overflow: hidden;
        }
        .account-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .account-addr {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 网络标识 */
        .network-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        .network-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
        }

        /* 资产卡片 */
        .asset-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            margin: 8px 0;
        }
        .balance-fiat {
            color: var(--sub);
            font-size: 14px;
        }

        /* 操作按钮 */
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .action-btn {
            flex: 1;
            background: var(--card);
            border: none;
            border-radius: 12px;
            padding: 14px 0;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #2a2a2a; }

        /* 代币列表 */
        .token-list-title {
            color: var(--sub);
            font-size: 13px;
            margin-bottom: 10px;
            padding-left: 8px;
        }
        .token-item {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .token-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .token-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }
        .token-name { font-weight: 500; }
        .token-symbol { color: var(--sub); font-size: 13px; }
        .token-balance { text-align: right; }
        .token-balance .amount { font-weight: 600; }
        .token-balance .fiat { color: var(--sub); font-size: 12px; }

        /* 右下角圆形按钮 */
        .fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(76, 110, 245, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 0.2s, background 0.2s;
        }
        .fab:active { transform: scale(0.95); }

        /* 网络切换弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--card);
            width: 100%;
            max-width: 420px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chain-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chain-list-item:hover { background: #2a2a2a; }
        .chain-list-item.active { background: #2a2a2a; }
        .chain-icon {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .chain-name { font-weight: 500; }
        .chain-symbol { color: var(--sub); font-size: 13px; }

        /* 导入/设置页面 */
        .settings-section { margin-top: 24px; }
        .import-box textarea {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
            margin: 8px 0;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .danger-text { color: var(--danger); font-size: 12px; margin-top: 8px; display: block; }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部 -->
    <div class="header">
        <div class="account-info" onclick="showAccountSelector()">
            <div class="account-dot">👤</div>
            <span class="account-addr" id="topAddress">未导入</span>
        </div>
        <div class="network-badge" onclick="openNetworkModal()">
            <div class="network-dot"></div>
            <span id="topNetwork">Ethereum</span>
        </div>
    </div>

    <!-- 资产卡片 -->
    <div class="asset-card">
        <div style="font-size:14px; color:var(--sub);">总资产</div>
        <div class="balance-amount" id="totalBalance">0.00</div>
        <div class="balance-fiat" id="fiatValue">$0.00 USD</div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
        <button class="action-btn" onclick="showSendModal()">
            <span>📤</span> 发送
        </button>
        <button class="action-btn" onclick="showReceiveModal()">
            <span>📥</span> 接收
        </button>
        <button class="action-btn" onclick="showImportSection()">
            <span>🔑</span> 导入
        </button>
    </div>

    <!-- 代币列表 -->
    <div class="token-list-title">资产</div>
    <div id="tokenList">
        <!-- 动态生成 -->
    </div>

    <!-- 设置/导入区域（默认隐藏） -->
    <div id="importSection" class="settings-section" style="display:none;">
        <h4 style="margin-bottom:8px;">导入钱包</h4>
        <div class="import-box">
            <textarea id="secretInput" placeholder="输入助记词（空格分隔）或私钥（0x开头）" rows="3"></textarea>
            <button class="btn-primary" onclick="importWallet()">导入</button>
            <span class="danger-text">⚠️ 私钥明文存储，仅测试用</span>
        </div>
        <h4 style="margin:16px 0 8px;">管理账户</h4>
        <select id="accountSelect" onchange="switchAccount()" style="width:100%; background:var(--card); border:1px solid var(--border); color:white; padding:12px; border-radius:12px; margin-bottom:8px;">
            <option value="">-- 选择账户 --</option>
        </select>
        <button class="btn-outline" onclick="deleteAccount()">删除当前账户</button>
    </div>
</div>

<!-- 右下角圆形按钮 -->
<button class="fab" onclick="openNetworkModal()">🌐</button>

<!-- 网络切换弹窗 -->
<div class="modal-overlay" id="networkModal">
    <div class="modal-content">
        <div class="modal-title">
            <span>选择网络</span>
            <span onclick="closeNetworkModal()" style="cursor:pointer; font-size:24px;">&times;</span>
        </div>
        <div id="chainListContainer"></div>
    </div>
</div>

<script src="js/ethers.umd.min.js"></script>
<script>
    // ========== 多链配置 ==========
    const chains = [
        { id: 1, name: "Ethereum", symbol: "ETH", explorer: "https://etherscan.io", rpcs: ["https://eth.llamarpc.com","https://rpc.ankr.com/eth"] },
        { id: 56, name: "BNB Chain", symbol: "BNB", explorer: "https://bscscan.com", rpcs: ["https://bsc-dataseed.binance.org","https://bsc-dataseed1.defibit.io"] },
        { id: 97, name: "BSC Testnet", symbol: "tBNB", explorer: "https://testnet.bscscan.com", rpcs: ["https://data-seed-prebsc-1-s1.binance.org:8545","https://bsc-testnet.publicnode.com"] },
        { id: 137, name: "Polygon", symbol: "MATIC", explorer: "https://polygonscan.com", rpcs: ["https://polygon-rpc.com","https://rpc-mainnet.maticvigil.com"] },
        { id: 42161, name: "Arbitrum", symbol: "ETH", explorer: "https://arbiscan.io", rpcs: ["https://arb1.arbitrum.io/rpc"] },
        { id: 10, name: "Optimism", symbol: "ETH", explorer: "https://optimistic.etherscan.io", rpcs: ["https://mainnet.optimism.io"] },
        { id: 43114, name: "Avalanche", symbol: "AVAX", explorer: "https://snowtrace.io", rpcs: ["https://api.avax.network/ext/bc/C/rpc"] }
    ];

    // 全局状态
    let wallet = null;
    let provider = null;
    let currentChainId = 1; // 默认以太坊
    let accounts = [];

    // ========== 初始化 ==========
    function loadAccounts() {
        const stored = localStorage.getItem('mywallet_accounts');
        if (stored) {
            try { accounts = JSON.parse(stored); } catch(e) { accounts = []; }
        }
        updateAccountSelect();
        if (accounts.length > 0 && !wallet) {
            document.getElementById('accountSelect').value = 0;
            switchAccount();
        }
    }

    function saveAccounts() {
        localStorage.setItem('mywallet_accounts', JSON.stringify(accounts));
        updateAccountSelect();
    }

    function updateAccountSelect() {
        const select = document.getElementById('accountSelect');
        select.innerHTML = '<option value="">-- 选择账户 --</option>';
        accounts.forEach((acc, idx) => {
            const option = document.createElement('option');
            option.value = idx;
            option.text = `${acc.address.substring(0,8)}... (${acc.type})`;
            select.appendChild(option);
        });
    }

    function switchAccount() {
        const idx = document.getElementById('accountSelect').value;
        if (idx === '') { wallet = null; updateUI(); return; }
        const acc = accounts[parseInt(idx)];
        try {
            wallet = acc.type === 'mnemonic' ? ethers.Wallet.fromMnemonic(acc.mnemonic) : new ethers.Wallet(acc.privateKey);
            if (provider) wallet = wallet.connect(provider);
            updateUI();
            loadBalances();
        } catch(e) { alert('切换失败: '+e.message); }
    }

    async function importWallet() {
        const input = document.getElementById('secretInput').value.trim();
        if (!input) return alert('请输入助记词或私钥');
        let newWallet, type, mnemonic = null;
        if (input.startsWith('0x') && input.length === 66) {
            newWallet = new ethers.Wallet(input);
            type = 'privateKey';
        } else {
            try {
                newWallet = ethers.Wallet.fromMnemonic(input);
                type = 'mnemonic';
                mnemonic = input;
            } catch(e) { return alert('无效的助记词或私钥'); }
        }
        if (accounts.some(a => a.address === newWallet.address)) return alert('地址已存在');
        accounts.push({ address: newWallet.address, privateKey: newWallet.privateKey, type, mnemonic });
        saveAccounts();
        wallet = newWallet;
        if (provider) wallet = wallet.connect(provider);
        document.getElementById('secretInput').value = '';
        document.getElementById('accountSelect').value = accounts.length - 1;
        updateUI();
        loadBalances();
    }

    function deleteAccount() {
        const idx = document.getElementById('accountSelect').value;
        if (idx === '') return;
        if (!confirm('确定删除该账户？')) return;
        accounts.splice(parseInt(idx), 1);
        saveAccounts();
        wallet = null;
        updateUI();
        if (accounts.length > 0) { document.getElementById('accountSelect').value = 0; switchAccount(); }
    }

    // ========== 网络与 Provider ==========
    async function connectToChain(chain) {
        const rpcs = chain.rpcs;
        for (const rpc of rpcs) {
            try {
                const prov = new ethers.providers.JsonRpcProvider({ url: rpc, timeout: 10000 }, { chainId: chain.id, name: chain.name });
                await prov.getBlockNumber();
                return prov;
            } catch(e) { console.warn('RPC失败:', rpc, e.message); }
        }
        throw new Error('所有节点不可用');
    }

    async function switchChain(chainId) {
        const chain = chains.find(c => c.id === chainId);
        if (!chain) return;
        try {
            provider = await connectToChain(chain);
            currentChainId = chain.id;
            if (wallet) wallet = wallet.connect(provider);
            updateNetworkUI();
            loadBalances();
            closeNetworkModal();
        } catch(e) { alert('网络切换失败: '+e.message); }
    }

    async function loadBalances() {
        if (!wallet || !provider) return;
        const chain = chains.find(c => c.id === currentChainId);
        const symbol = chain?.symbol || 'ETH';
        try {
            const balance = await provider.getBalance(wallet.address);
            const formatted = ethers.utils.formatEther(balance);
            document.getElementById('totalBalance').innerText = `${parseFloat(formatted).toFixed(4)} ${symbol}`;
            document.getElementById('fiatValue').innerText = `$0.00 USD`; // 可集成价格API
            renderTokenList(symbol, formatted);
        } catch(e) {
            document.getElementById('totalBalance').innerText = '--';
            document.getElementById('fiatValue').innerText = '查询失败';
        }
    }

    function renderTokenList(mainSymbol, mainBalance) {
        const container = document.getElementById('tokenList');
        container.innerHTML = `
            <div class="token-item">
                <div class="token-info">
                    <div class="token-icon">🔷</div>
                    <div>
                        <div class="token-name">${mainSymbol}</div>
                        <div class="token-symbol">主网币</div>
                    </div>
                </div>
                <div class="token-balance">
                    <div class="amount">${parseFloat(mainBalance).toFixed(4)}</div>
                    <div class="fiat">$0.00</div>
                </div>
            </div>
        `;
    }

    // ========== UI 更新 ==========
    function updateUI() {
        const addrEl = document.getElementById('topAddress');
        if (wallet) {
            addrEl.innerText = wallet.address.substring(0,6)+'...'+wallet.address.slice(-4);
        } else {
            addrEl.innerText = '未导入';
        }
        updateNetworkUI();
    }

    function updateNetworkUI() {
        const chain = chains.find(c => c.id === currentChainId);
        document.getElementById('topNetwork').innerText = chain?.name || '未知';
        renderChainList();
    }

    // ========== 网络弹窗 ==========
    function openNetworkModal() {
        document.getElementById('networkModal').classList.add('active');
        renderChainList();
    }
    function closeNetworkModal() { document.getElementById('networkModal').classList.remove('active'); }
    function renderChainList() {
        const container = document.getElementById('chainListContainer');
        container.innerHTML = chains.map(chain => `
            <div class="chain-list-item ${chain.id === currentChainId ? 'active' : ''}" onclick="switchChain(${chain.id})">
                <div class="chain-icon">⛓️</div>
                <div>
                    <div class="chain-name">${chain.name}</div>
                    <div class="chain-symbol">${chain.symbol}</div>
                </div>
                ${chain.id === currentChainId ? '<span style="margin-left:auto; color:var(--green);">✔</span>' : ''}
            </div>
        `).join('');
    }

    // ========== 收发操作（简化） ==========
    function showSendModal() {
        const toAddr = prompt('接收地址:');
        if (!toAddr) return;
        const amount = prompt('金额:');
        if (!amount) return;
        if (!wallet || !provider) return alert('请先导入钱包并连接网络');
        wallet.sendTransaction({ to: toAddr, value: ethers.utils.parseEther(amount) })
            .then(tx => alert('交易已发送: '+tx.hash))
            .catch(e => alert('发送失败: '+e.message));
    }
    function showReceiveModal() {
        if (wallet) alert('你的地址: '+wallet.address);
        else alert('请先导入钱包');
    }
    function showImportSection() {
        const sec = document.getElementById('importSection');
        sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
    }

    // ========== 启动 ==========
    window.onload = () => {
        loadAccounts();
        // 默认连接以太坊
        switchChain(1);
        // 点击遮罩关闭弹窗
        document.getElementById('networkModal').addEventListener('click', function(e) {
            if (e.target === this) closeNetworkModal();
        });
    };
</script>
</body>
</html>
