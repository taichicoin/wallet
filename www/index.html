<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Wallet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="toast" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 24px; border-radius:8px; z-index:999; display:none; max-width:80%; text-align:center; font-size:14px;"></div>

<div class="container">
    <div class="header">
        <div class="account-info" onclick="showImportSection()">
            <div class="account-dot">👤</div>
            <span class="account-addr" id="topAddress">未导入</span>
        </div>
        <div class="network-badge" onclick="openNetworkModal()">
            <div class="network-dot"></div>
            <span id="topNetwork">Ethereum</span>
        </div>
    </div>

    <div class="asset-card">
        <div style="font-size:14px; color:var(--sub);">总资产</div>
        <div class="balance-amount" id="totalBalance">0.00</div>
        <div class="balance-fiat" id="fiatValue">$0.00 USD</div>
    </div>

    <div class="actions">
        <button class="action-btn" onclick="openSendModal()">
            <span>📤</span> 发送
        </button>
        <button class="action-btn" onclick="showReceiveModal()">
            <span>📥</span> 接收
        </button>
        <button class="action-btn" onclick="showImportSection()">
            <span>🔑</span> 导入
        </button>
    </div>

    <div class="token-list-title">资产</div>
    <div id="tokenList"></div>

    <div id="importSection" class="settings-section" style="display:none;">
        <h4>导入钱包</h4>
        <textarea id="secretInput" placeholder="助记词 或 私钥(0x开头)" rows="3"></textarea>
        <input type="password" id="encryptPassword" placeholder="设置解锁密码（至少6位）" />
        <input type="password" id="encryptPasswordConfirm" placeholder="确认解锁密码" />
        <button class="btn-primary" onclick="importWallet()">加密导入</button>
        <span class="danger-text">⚠️ 密码丢失无法找回，私钥将以加密形式存储</span>
        <h4 style="margin-top:16px;">管理账户</h4>
        <select id="accountSelect" onchange="switchAccount()" style="background:var(--card); border:1px solid var(--border); color:white; padding:12px; border-radius:8px; width:100%;">
            <option value="">-- 选择账户 --</option>
        </select>
        <button class="btn-outline" onclick="deleteAccount()">删除当前账户</button>
    </div>
</div>

<button class="fab" onclick="openNetworkModal()">🌐</button>

<!-- 网络切换弹窗 -->
<div class="modal-overlay" id="networkModal">
    <div class="modal-content">
        <div class="modal-title">
            <span>选择网络</span>
            <span onclick="closeNetworkModal()" class="close-btn">&times;</span>
        </div>
        <div id="chainListContainer"></div>
    </div>
</div>

<!-- 发送弹窗 -->
<div class="modal-overlay" id="sendModal">
    <div class="modal-content">
        <div class="modal-title">
            <span>发送交易</span>
            <span onclick="closeSendModal()" class="close-btn">&times;</span>
        </div>
        <input type="text" id="sendTo" placeholder="接收地址 (0x...)" />
        <input type="text" id="sendAmount" placeholder="金额 (主链币)" />
        <button class="btn-primary" onclick="executeSend()">确认发送</button>
        <div id="sendStatus" class="tx-status" style="display:none;"></div>
    </div>
</div>

<!-- 密码解锁弹窗 -->
<div class="modal-overlay" id="unlockModal">
    <div class="modal-content">
        <div class="modal-title">
            <span>解锁钱包</span>
            <span onclick="closeUnlockModal()" class="close-btn">&times;</span>
        </div>
        <input type="password" id="unlockPassword" placeholder="输入解锁密码" />
        <button class="btn-primary" id="unlockBtn" onclick="executeUnlock()">解锁</button>
        <div id="unlockStatus" class="tx-status" style="display:none;"></div>
    </div>
</div>

<script src="js/ethers.umd.min.js"></script>
<script src="main.js"></script>
</body>
</html>
