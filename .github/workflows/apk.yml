name: Build Wallet APK (Ultra Compatible)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          rm commandlinetools-linux-*.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0"

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -e
          mkdir -p build-apk
          cd build-apk

          # 复制网页资产（确保路径）
          cp -r ../www assets
          echo ">>> 验证 assets 文件..."
          ls -l assets/index.html
          ls -l assets/js/ethers.umd.min.js

          # ========== 清单：极低 targetSdk 规避新系统限制 + 强制硬件加速 + 系统 WebView 声明 ==========
          cat > AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.dev.mywallet">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="28"/>
              <uses-permission android:name="android.permission.INTERNET" />
              <!-- 允许明文流量（HTTP RPC） -->
              <application
                  android:label="My Wallet"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <!-- 显式声明使用系统 WebView 提供器 -->
                  <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ========== 极简防崩溃 MainActivity ==========
          cat > MainActivity.java << 'JAVA'
          package com.dev.mywallet;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.widget.Toast;
          import android.widget.TextView;
          import android.widget.LinearLayout;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              private WebView mWebView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      // 创建 WebView 时传入 application context 避免内存泄漏
                      mWebView = new WebView(this);
                      WebSettings s = mWebView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      // 以下设置针对低版本兼容
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                      if (Build.VERSION.SDK_INT >= 21) {
                          s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      }
                      // 禁用会导致闪退的不稳定特性
                      mWebView.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                              showError("WebView error: " + error.getDescription());
                          }
                      });
                      // 启用远程调试（手机连接电脑可检查）
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                          WebView.setWebContentsDebuggingEnabled(true);
                      }

                      mWebView.loadUrl("file:///android_asset/index.html");
                      setContentView(mWebView);

                  } catch (Exception e) {
                      showError("启动异常: " + e.getMessage());
                  }
              }

              private void showError(String msg) {
                  // 创建简单的错误界面，防止直接退出
                  LinearLayout layout = new LinearLayout(this);
                  layout.setBackgroundColor(Color.WHITE);
                  TextView tv = new TextView(this);
                  tv.setText("❌ " + msg);
                  tv.setTextSize(18);
                  tv.setTextColor(Color.RED);
                  tv.setPadding(32, 32, 32, 32);
                  layout.addView(tv);
                  setContentView(layout);
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show();
              }
          }
          JAVA

          # 资源文件
          mkdir -p res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > res/values/strings.xml

          export PATH=$ANDROID_HOME/build-tools/33.0.0:$PATH

          # 1. AAPT2 编译和链接
          aapt2 compile --dir res -o compiled.flata
          aapt2 link -I $ANDROID_HOME/platforms/android-33/android.jar \
            --manifest AndroidManifest.xml \
            --java . \
            -A assets \
            -o base.apk \
            compiled.flata

          # 2. 手动补 R.java
          if [ ! -f com/dev/mywallet/R.java ]; then
              mkdir -p com/dev/mywallet
              echo 'package com.dev.mywallet; public final class R {}' > com/dev/mywallet/R.java
          fi

          # 3. 编译 Java
          mkdir classes
          javac -source 1.8 -target 1.8 -cp $ANDROID_HOME/platforms/android-33/android.jar \
            -d classes MainActivity.java com/dev/mywallet/R.java

          # 4. 生成 DEX
          d8 --lib $ANDROID_HOME/platforms/android-33/android.jar \
            --output classes.jar $(find classes -name "*.class")
          mv classes.jar classes.dex

          # 5. 注入 DEX
          cp base.apk wallet.apk
          zip -j wallet.apk classes.dex

          # 6. 签名
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android \
            --out ../app-debug.apk wallet.apk

          echo ">>> 构建完成，APK 大小:"
          ls -l ../app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          path: app-debug.apk
