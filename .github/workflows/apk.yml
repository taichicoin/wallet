name: Build Wallet APK (Final)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.0'

      - name: Prepare Gradle Project
        run: |
          # 1. 项目结构
          mkdir -p wallet-project/app/src/main/java/com/dev/mywallet
          mkdir -p wallet-project/app/src/main/res/values
          mkdir -p wallet-project/gradle/wrapper

          # 2. 正确复制整个 www 到 assets（先删除可能存在的空 assets）
          rm -rf wallet-project/app/src/main/assets
          cp -r www wallet-project/app/src/main/assets
          echo ">>> assets 目录内容："
          ls -la wallet-project/app/src/main/assets/
          echo ">>> js 目录："
          ls -la wallet-project/app/src/main/assets/js/

          # 3. 下载 Gradle Wrapper JAR 和 properties
          cd wallet-project/gradle/wrapper
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          cat > gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cd ../../..

          # 4. 创建 gradlew 脚本
          cat > wallet-project/gradlew << 'SCRIPT'
          #!/bin/sh
          APP_HOME=$(dirname $(readlink -f $0))
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -cp "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          SCRIPT
          chmod +x wallet-project/gradlew

          # 5. settings.gradle（配置插件仓库）
          cat > wallet-project/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyWallet"
          include ':app'
          EOF

          # 6. 项目级 build.gradle
          cat > wallet-project/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          EOF

          # 7. 模块级 build.gradle
          cat > wallet-project/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dev.mywallet'
              compileSdk 33

              defaultConfig {
                  applicationId "com.dev.mywallet"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          # 8. 清单
          cat > wallet-project/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="My Wallet"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 9. MainActivity（使用 WebViewAssetLoader）
          cat > wallet-project/app/src/main/java/com/dev/mywallet/MainActivity.java << 'JAVA'
          package com.dev.mywallet;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
                  setContentView(webView);
              }
          }
          JAVA

          echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > wallet-project/app/src/main/res/values/strings.xml

      - name: Build APK with Gradle
        run: |
          cd wallet-project
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          path: app-debug.apk
