name: Build Wallet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Prepare Project
        run: |
          mkdir -p app/src/main/java/com/dev/mywallet
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          rm -rf app/src/main/assets
          cp -r www app/src/main/assets

          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert www/imagine/logo.jpg -resize 512x512 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          echo "✅ 应用图标已生成"

          echo "android.useAndroidX=true" > gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MyWallet"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.9.1' apply false }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.dev.mywallet'; compileSdk 34
              defaultConfig { applicationId "com.dev.mywallet"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { debug { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.8.0' }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="My Wallet"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dev/mywallet/MainActivity.java << 'JAVA'
          package com.dev.mywallet;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.graphics.Color;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.JavascriptInterface;
          import android.widget.FrameLayout;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private WebView mainWebView;
              private WebView dappWebView;
              private FrameLayout container;
              private Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.KITKAT) {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                  }
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().setStatusBarColor(Color.parseColor("#33FFFFFF"));
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
                  }

                  container = new FrameLayout(this);
                  setContentView(container);

                  mainWebView = new WebView(this);
                  WebSettings s = mainWebView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);

                  WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  mainWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  mainWebView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void showDapp(String url) {
                          // 等待 500ms 布局稳定后获取坐标
                          handler.postDelayed(() -> {
                              String js = "var a=document.getElementById('dappContentArea');" +
                                  "if(!a) 'null'; else {" +
                                  "var r=a.getBoundingClientRect();" +
                                  "JSON.stringify({left:r.left,top:r.top,width:r.width,height:r.height});}";
                              mainWebView.evaluateJavascript(js, result -> {
                                  if (result == null || result.equals("null")) return;
                                  try {
                                      result = result.trim().replace("\"", "");
                                      String json = result;
                                      if (!json.startsWith("{")) return;
                                      json = json.substring(1, json.length()-1);
                                      int left=0, top=0, width=0, height=0;
                                      for (String pair : json.split(",")) {
                                          String[] kv = pair.split(":");
                                          if (kv.length==2) {
                                              String key = kv[0].trim().replaceAll("\"","");
                                              int val = Math.round(Float.parseFloat(kv[1].trim()));
                                              if ("left".equals(key)) left=val;
                                              else if ("top".equals(key)) top=val;
                                              else if ("width".equals(key)) width=val;
                                              else if ("height".equals(key)) height=val;
                                          }
                                      }
                                      if (width>0 && height>0) {
                                          showDappWebView(url, left, top, width, height);
                                      }
                                  } catch (Exception e) {}
                              });
                          }, 500);
                      }

                      @JavascriptInterface
                      public void hideDapp() {
                          handler.post(() -> {
                              if (dappWebView != null) {
                                  container.removeView(dappWebView);
                                  dappWebView.destroy();
                                  dappWebView = null;
                              }
                          });
                      }

                      @JavascriptInterface
                      public void returnResult(String id, String error, String result) {
                          handler.post(() -> {
                              if (dappWebView != null) {
                                  String safeResult = (result != null) ? result : "null";
                                  String js = "window._receiveWalletResult('"+id+"',"+error+","+safeResult+");";
                                  dappWebView.evaluateJavascript(js, null);
                              }
                          });
                      }
                  }, "android");

                  container.addView(mainWebView, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  mainWebView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              private void showDappWebView(String url, int left, int top, int width, int height) {
                  if (dappWebView != null) {
                      FrameLayout.LayoutParams params = (FrameLayout.LayoutParams) dappWebView.getLayoutParams();
                      params.leftMargin = left;
                      params.topMargin = top;
                      params.width = width;
                      params.height = height;
                      dappWebView.setLayoutParams(params);
                      if (!url.startsWith("http")) url = "https://" + url;
                      dappWebView.loadUrl(url);
                      return;
                  }

                  dappWebView = new WebView(this);
                  WebSettings ds = dappWebView.getSettings();
                  ds.setJavaScriptEnabled(true);
                  ds.setDomStorageEnabled(true);

                  dappWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String u) {
                          super.onPageFinished(view, u);
                          String js = "window.ethereum={isMetaMask:true,chainId:'0x1',request:function({method,params}){return new Promise(function(resolve,reject){var id='dapp_'+Date.now();window._ethereumCallbacks=window._ethereumCallbacks||{};window._ethereumCallbacks[id]={resolve,reject};var jp=JSON.stringify(params||[]);var e=jp.replace(/\\\\/g,'\\\\\\\\').replace(/'/g,\"\\\\'\");var js='window.__walletAPI.handle(\\''+method+'\\',\\''+e+'\\',\\''+id+'\\');';window.android.callWallet(js);})}};window._receiveWalletResult=function(id,err,res){var cb=window._ethereumCallbacks&&window._ethereumCallbacks[id];if(cb){if(err)cb.reject(new Error(err));else cb.resolve(res);delete window._ethereumCallbacks[id];}};";
                          dappWebView.evaluateJavascript(js, null);
                          dappWebView.addJavascriptInterface(new Object() {
                              @JavascriptInterface
                              public void callWallet(String js) {
                                  handler.post(() -> mainWebView.evaluateJavascript(js, null));
                              }
                          }, "android");
                      }
                  });

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(width, height);
                  params.leftMargin = left;
                  params.topMargin = top;
                  container.addView(dappWebView, params);

                  if (!url.startsWith("http")) url = "https://" + url;
                  dappWebView.loadUrl(url);
              }
          }
          JAVA

          echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > app/src/main/res/values/strings.xml

      - name: Build APK with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.11.1'
          arguments: assembleDebug --no-daemon

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          echo "APK 大小: $(stat -c%s app-debug.apk) 字节"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          path: app-debug.apk
