name: Build Wallet APK (Stable)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          rm commandlinetools-linux-*.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0"

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -e
          mkdir -p build-apk
          cd build-apk

          cp -r ../www assets
          echo ">>> assets 内容:"
          ls -la assets/
          ls -la assets/js/

          # 清单：targetSdk 28 避免新系统文件限制
          cat > AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.dev.mywallet">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="28"/>
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="My Wallet"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity 使用 WebViewAssetLoader 安全加载
          cat > MainActivity.java << 'JAVA'
          package com.dev.mywallet;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebViewAssetLoader;
          import android.net.Uri;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.security.MessageDigest;

          public class MainActivity extends Activity {
              private WebView mWebView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      mWebView = new WebView(this);
                      WebSettings s = mWebView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setAllowFileAccess(false); // 关闭 file:// 协议
                      s.setAllowContentAccess(false);
                      if (android.os.Build.VERSION.SDK_INT >= 21) {
                          s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      }

                      // 使用 WebViewAssetLoader 从 assets 提供资源
                      final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                      mWebView.setWebViewClient(new WebViewClient() {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              return assetLoader.shouldInterceptRequest(request.getUrl());
                          }

                          @Override
                          @SuppressWarnings("deprecation")
                          public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                              return assetLoader.shouldInterceptRequest(Uri.parse(url));
                          }
                      });

                      // 启用远程调试（手机连接电脑可检查）
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.KITKAT) {
                          WebView.setWebContentsDebuggingEnabled(true);
                      }

                      // 加载 assets 中的 index.html
                      mWebView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
                      setContentView(mWebView);

                  } catch (Exception e) {
                      setContentView(new android.widget.TextView(this));
                      ((android.widget.TextView)findViewById(android.R.id.content)).setText("启动失败: " + e.getMessage());
                  }
              }
          }
          JAVA

          # 资源文件
          mkdir -p res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > res/values/strings.xml

          export PATH=$ANDROID_HOME/build-tools/33.0.0:$PATH

          aapt2 compile --dir res -o compiled.flata
          aapt2 link -I $ANDROID_HOME/platforms/android-33/android.jar \
            --manifest AndroidManifest.xml \
            --java . \
            -A assets \
            -o base.apk \
            compiled.flata

          # 手动补 R.java
          [ ! -f com/dev/mywallet/R.java ] && {
              mkdir -p com/dev/mywallet
              echo 'package com.dev.mywallet; public final class R {}' > com/dev/mywallet/R.java
          }

          mkdir classes
          javac -source 1.8 -target 1.8 -cp $ANDROID_HOME/platforms/android-33/android.jar \
            -d classes MainActivity.java com/dev/mywallet/R.java

          d8 --lib $ANDROID_HOME/platforms/android-33/android.jar \
            --output classes.jar $(find classes -name "*.class")
          mv classes.jar classes.dex

          cp base.apk wallet.apk
          zip -j wallet.apk classes.dex

          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android \
            --out ../app-debug.apk wallet.apk

          echo ">>> APK 构建成功"
          ls -l ../app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          path: app-debug.apk
