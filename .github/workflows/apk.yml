name: Build Wallet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          rm commandlinetools-linux-*.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0"

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -e
          mkdir -p build-apk
          cd build-apk
          
          # 复制网页文件
          cp -r ../www assets
          echo ">>> assets 目录内容:"
          ls -la assets/
          ls -la assets/js/ || true

          # 清单（包含 INTERNET 权限，WebView 加速）
          cat > AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.dev.mywallet">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33"/>
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="My Wallet" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 更健壮的 MainActivity（添加文件访问、错误提示）
          cat > MainActivity.java << 'JAVA'
          package com.dev.mywallet;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.widget.Toast;
          import android.webkit.ConsoleMessage;
          import android.webkit.WebChromeClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      WebView wv = new WebView(this);
                      WebSettings s = wv.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      // 解决本地文件加载限制（Android 7.0+）
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                      s.setAllowContentAccess(true);
                      if (Build.VERSION.SDK_INT >= 21) {
                          s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      }
                      wv.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public boolean onConsoleMessage(ConsoleMessage cm) {
                              android.util.Log.d("WalletJS", cm.message());
                              return true;
                          }
                      });
                      wv.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                              Toast.makeText(MainActivity.this, "加载错误: " + error.getDescription(), Toast.LENGTH_LONG).show();
                          }
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              // 页面加载完成
                          }
                      });
                      wv.loadUrl("file:///android_asset/index.html");
                      setContentView(wv);
                  } catch (Exception e) {
                      Toast.makeText(this, "启动失败: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      finish();
                  }
              }
          }
          JAVA

          # 资源文件
          mkdir -p res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > res/values/strings.xml

          export PATH=$ANDROID_HOME/build-tools/33.0.0:$PATH
          
          # 1. 用 aapt2 编译并链接
          aapt2 compile --dir res -o compiled.flata
          aapt2 link -I $ANDROID_HOME/platforms/android-33/android.jar \
            --manifest AndroidManifest.xml \
            --java . \
            -A assets \
            -o base.apk \
            compiled.flata

          # 2. 手动补全 R.java（如果未生成）
          if [ ! -f com/dev/mywallet/R.java ]; then
              echo "R.java 未自动生成，手动创建..."
              mkdir -p com/dev/mywallet
              echo 'package com.dev.mywallet; public final class R {}' > com/dev/mywallet/R.java
          fi

          # 3. 编译 Java
          mkdir classes
          javac -source 1.8 -target 1.8 -cp $ANDROID_HOME/platforms/android-33/android.jar \
            -d classes MainActivity.java com/dev/mywallet/R.java

          # 4. 生成 DEX
          d8 --lib $ANDROID_HOME/platforms/android-33/android.jar \
            --output classes.jar $(find classes -name "*.class")
          mv classes.jar classes.dex

          # 5. 注入 DEX（使用 zip 命令，更兼容）
          cp base.apk wallet.apk
          zip -j wallet.apk classes.dex

          # 6. 签名
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android \
            --out ../app-debug.apk wallet.apk

          echo ">>> 最终 APK 大小:"
          ls -l ../app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          path: app-debug.apk
