name: Build Wallet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          rm commandlinetools-linux-*.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0"

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build-apk
          cd build-apk
          cp -r ../www assets
          # 清单
          cat > AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.dev.mywallet">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33"/>
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="My Wallet" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity
          cat > MainActivity.java << 'JAVA'
          package com.dev.mywallet;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView wv = new WebView(this);
                  wv.setWebViewClient(new WebViewClient());
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
              }
          }
          JAVA

          # 资源
          mkdir -p res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > res/values/strings.xml

          export PATH=$ANDROID_HOME/build-tools/33.0.0:$PATH
          aapt2 compile --dir res -o compiled.flata
          aapt2 link -I $ANDROID_HOME/platforms/android-33/android.jar --manifest AndroidManifest.xml --java . -A assets -o base.apk compiled.flata

          # 如果 R.java 未生成，手动创建
          if [ ! -f com/dev/mywallet/R.java ]; then
              mkdir -p com/dev/mywallet
              echo 'package com.dev.mywallet; public final class R {}' > com/dev/mywallet/R.java
          fi

          mkdir classes
          javac -source 1.8 -target 1.8 -cp $ANDROID_HOME/platforms/android-33/android.jar -d classes MainActivity.java com/dev/mywallet/R.java
          d8 --lib $ANDROID_HOME/platforms/android-33/android.jar --output classes.jar $(find classes -name "*.class")
          mv classes.jar classes.dex

          # 注入 DEX
          cp base.apk wallet.apk
          jar uf wallet.apk classes.dex

          # 生成调试签名
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --out ../app-debug.apk wallet.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          path: app-debug.apk
