name: Build Wallet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Prepare Project
        run: |
          mkdir -p app/src/main/java/com/dev/mywallet
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          rm -rf app/src/main/assets
          cp -r www app/src/main/assets

          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert www/imagine/logo.jpg -resize 512x512 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          echo "✅ 应用图标已生成"

          echo "android.useAndroidX=true" > gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyWallet"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dev.mywallet'
              compileSdk 34

              defaultConfig {
                  applicationId "com.dev.mywallet"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="My Wallet"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dev/mywallet/MainActivity.java << 'JAVA'
          package com.dev.mywallet;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.graphics.Color;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.JavascriptInterface;
          import android.widget.FrameLayout;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private WebView mainWebView;
              private WebView dappEmbeddedWebView = null;
              private FrameLayout container;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().setStatusBarColor(Color.parseColor("#33FFFFFF"));
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }

                  container = new FrameLayout(this);
                  setContentView(container);

                  mainWebView = new WebView(this);
                  WebSettings settings = mainWebView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  mainWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  mainWebView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void openAutoDapp(String url, int left, int top, int width, int height) {
                          runOnUiThread(() -> showEmbeddedDappBrowser(url, left, top, width, height));
                      }
                      @JavascriptInterface
                      public void closeAutoDapp() {
                          runOnUiThread(() -> closeDappNative());
                      }
                      @JavascriptInterface
                      public void returnResult(String id, String error, String result) {
                          runOnUiThread(() -> {
                              if (dappEmbeddedWebView != null) {
                                  String safeResult = (result != null) ? result : "null";
                                  String callbackJs = "window._receiveWalletResult && window._receiveWalletResult('" 
                                      + id + "', " + error + ", " + safeResult + ");";
                                  dappEmbeddedWebView.evaluateJavascript(callbackJs, null);
                              }
                          });
                      }
                  }, "android");

                  container.addView(mainWebView, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  mainWebView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              private void showEmbeddedDappBrowser(String url, int left, int top, int width, int height) {
                  if (width <= 0 || height <= 0) return; // 拒绝无效坐标

                  if (dappEmbeddedWebView != null) {
                      updateEmbeddedWebViewLayout(left, top, width, height);
                      dappEmbeddedWebView.loadUrl(url);
                      return;
                  }

                  dappEmbeddedWebView = new WebView(this);
                  WebSettings dappSettings = dappEmbeddedWebView.getSettings();
                  dappSettings.setJavaScriptEnabled(true);
                  dappSettings.setDomStorageEnabled(true);

                  dappEmbeddedWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectEthereumProvider(dappEmbeddedWebView);
                      }
                  });

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(width, height);
                  params.leftMargin = left;
                  params.topMargin = top;
                  container.addView(dappEmbeddedWebView, params);

                  if (!url.startsWith("http://") && !url.startsWith("https://")) {
                      url = "https://" + url;
                  }
                  dappEmbeddedWebView.loadUrl(url);
              }

              private void updateEmbeddedWebViewLayout(int left, int top, int width, int height) {
                  if (dappEmbeddedWebView != null) {
                      FrameLayout.LayoutParams params = (FrameLayout.LayoutParams) dappEmbeddedWebView.getLayoutParams();
                      params.leftMargin = left;
                      params.topMargin = top;
                      params.width = width;
                      params.height = height;
                      dappEmbeddedWebView.setLayoutParams(params);
                  }
              }

              private void closeDappNative() {
                  if (dappEmbeddedWebView != null) {
                      container.removeView(dappEmbeddedWebView);
                      dappEmbeddedWebView.destroy();
                      dappEmbeddedWebView = null;
                  }
              }

              private void injectEthereumProvider(WebView webView) {
                  String js =
                      "window.ethereum = {" +
                      "  isMetaMask: true," +
                      "  chainId: '0x" + Integer.toHexString(getCurrentChainId()) + "'," +
                      "  request: function({ method, params }) {" +
                      "    return new Promise(function(resolve, reject) {" +
                      "      var id = 'dapp_' + Date.now() + '_' + Math.random().toString(36);" +
                      "      window._ethereumCallbacks = window._ethereumCallbacks || {};" +
                      "      window._ethereumCallbacks[id] = { resolve: resolve, reject: reject };" +
                      "      var jsonParams = JSON.stringify(params || []);" +
                      "      var escapedParams = jsonParams.replace(/\\\\/g, '\\\\\\\\').replace(/'/g, \"\\\\'\");" +
                      "      var js = 'window.__walletAPI && window.__walletAPI.handle(\\'' + method + '\\', \\'' + escapedParams + '\\', \\'' + id + '\\');';" +
                      "      window.android.callWallet(js);" +
                      "    });" +
                      "  }" +
                      "};" +
                      "window._receiveWalletResult = function(id, error, result) {" +
                      "  var cb = window._ethereumCallbacks && window._ethereumCallbacks[id];" +
                      "  if (cb) {" +
                      "    if (error) cb.reject(new Error(error));" +
                      "    else cb.resolve(result);" +
                      "    delete window._ethereumCallbacks[id];" +
                      "  }" +
                      "};";

                  webView.evaluateJavascript(js, null);

                  dappEmbeddedWebView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void callWallet(String js) {
                          runOnUiThread(() -> {
                              mainWebView.evaluateJavascript(js, null);
                          });
                      }
                  }, "android");
              }

              private int getCurrentChainId() {
                  return 1;
              }
          }
          JAVA

          echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > app/src/main/res/values/strings.xml

      - name: Build APK with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.11.1'
          arguments: assembleDebug --no-daemon

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          echo "APK 大小: $(stat -c%s app-debug.apk) 字节"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          path: app-debug.apk
